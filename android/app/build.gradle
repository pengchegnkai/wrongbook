// android/app/build.gradle —— 关键配置片段
// 说明：flutter create 生成的文件结构可能不同（新版用 build.gradle.kts / plugins DSL）。
// 以 Flutter 官方模板为基础，仅同步以下 minSdk/targetSdk 与依赖。
// 版本号请以 Flutter 官方文档为准；未实测构建，需你验证。

android {
    namespace "com.cuoti.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.cuoti.app"
        minSdk 24        // google_mlkit_text_recognition 要求 minSdk 21+，取 24 保守值
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            // 签名配置由 flutter create 生成的 key.properties 流程处理，此处不展开
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

flutter {
    source '../..'
}
