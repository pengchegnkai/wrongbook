name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate platform project & merge app source
        run: |
          flutter --version
          flutter config --no-analytics
          # 1) 生成完整 Android 工程（包名 com.cuoti.cuoti_app）
          flutter create --org com.cuoti --project-name cuoti_app build_tmp
          # 2) 合入 Dart 源码与依赖清单
          rm -rf build_tmp/lib
          cp -r app/lib build_tmp/lib
          cp app/pubspec.yaml build_tmp/pubspec.yaml
          # 3) 覆盖 AndroidManifest（权限 + cleartext + 中文应用名）
          cp android/app/src/main/AndroidManifest.xml \
             build_tmp/android/app/src/main/AndroidManifest.xml
          # 4) 合入 network_security_config（允许内网明文 HTTP）
          mkdir -p build_tmp/android/app/src/main/res/xml
          cp android/app/src/main/res/xml/network_security_config.xml \
             build_tmp/android/app/src/main/res/xml/network_security_config.xml
          # 5) minSdk 24（google_mlkit_text_recognition 要求）
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' build_tmp/android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' build_tmp/android/app/build.gradle || true
          sed -i 's/minSdk flutter.minSdkVersion/minSdk 24/' build_tmp/android/app/build.gradle || true

      - name: flutter pub get
        working-directory: build_tmp
        run: flutter pub get

      - name: flutter analyze（非阻塞，仅记录）
        working-directory: build_tmp
        run: flutter analyze || true

      - name: Build release APK
        working-directory: build_tmp
        run: flutter build apk --release

      - name: Rename APK with short commit
        run: |
          cp build_tmp/build/app/outputs/flutter-apk/app-release.apk \
             cuoti-app-${GITHUB_SHA::7}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuoti-app-release-apk
          path: cuoti-app-*.apk
          if-no-files-found: error
