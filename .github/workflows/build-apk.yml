name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate platform project & merge app source
        run: |
          flutter --version
          flutter config --no-analytics
          # 1) 生成完整 Android 工程（包名 com.cuoti.cuoti_app）
          flutter create --org com.cuoti --project-name cuoti_app build_tmp
          # 2) 合入 Dart 源码与依赖清单
          rm -rf build_tmp/lib
          cp -r app/lib build_tmp/lib
          cp app/pubspec.yaml build_tmp/pubspec.yaml
          # 3) 覆盖 AndroidManifest（权限 + cleartext + 中文应用名）
          cp android/app/src/main/AndroidManifest.xml \
             build_tmp/android/app/src/main/AndroidManifest.xml
          # 4) 合入 network_security_config（允许内网明文 HTTP）
          mkdir -p build_tmp/android/app/src/main/res/xml
          cp android/app/src/main/res/xml/network_security_config.xml \
             build_tmp/android/app/src/main/res/xml/network_security_config.xml
          # 5) minSdk 24 / compileSdk 36 / targetSdk 36（file_picker 8.x 要求 compileSdk>=36）
          #    用 python 正则统一替换（兼容 kts 的 `compileSdk = flutter.xxx` 与 groovy 的 `compileSdkVersion flutter.xxx`）
          python3 ci/patch_sdk_versions.py build_tmp/android/app
          # 6) 关闭 R8 混淆/资源压缩：第三方插件的反射代码导致 minifyReleaseWithR8 失败
          #    个人内网应用无需混淆，换取构建稳定（APK 体积略大）
          #    脚本自动探测 build.gradle（Groovy）与 build.gradle.kts（Kotlin DSL，2026 stable 默认）
          python3 ci/disable_minify.py build_tmp/android/app
          ls -la build_tmp/android/app/ | grep -E 'build.gradle' || true
          # 7) 子模块 compileSdk 强制提升到 36：
          #    flutter_plugin_android_lifecycle 的 AAR metadata 要求 compileSdk>=36，
          #    而插件子模块的 compileSdk 由 Flutter 工具自动设为 flutter.compileSdkVersion（34/35），
          #    不继承 app 模块设置。反射调用 setCompileSdk；注意插件项目此时已被
          #    flutter-plugin-loader 评估，afterEvaluate 会报错，必须用 projectsEvaluated 钩子。
          if [ -f build_tmp/android/build.gradle.kts ]; then
            printf '%s\n' \
              '' \
              '// CI: 子模块 compileSdk 统一提升到 36（flutter_plugin_android_lifecycle AAR metadata 要求）' \
              'gradle.projectsEvaluated {' \
              '    allprojects {' \
              '        val androidExt = extensions.findByName("android") ?: return@allprojects' \
              '        val setter = androidExt.javaClass.methods.firstOrNull { it.name == "setCompileSdk" }' \
              '        if (setter != null) {' \
              '            try { setter.invoke(androidExt, "36") } catch (e: Exception) { println("compileSdk bump failed: $e") }' \
              '        }' \
              '    }' \
              '}' \
              >> build_tmp/android/build.gradle.kts
          elif [ -f build_tmp/android/build.gradle ]; then
            printf '%s\n' \
              '' \
              '// CI: 子模块 compileSdk 统一提升到 36' \
              'gradle.projectsEvaluated {' \
              '    allprojects { project ->' \
              '        if (project.extensions.findByName("android") != null) {' \
              '            def androidExt = project.extensions.getByName("android")' \
              '            def setter = androidExt.class.methods.find { it.name == "setCompileSdk" }' \
              '            if (setter != null) { try { setter.invoke(androidExt, "36") } catch (Exception e) { println("compileSdk bump failed: $e") } }' \
              '        }' \
              '    }' \
              '}' \
              >> build_tmp/android/build.gradle
          fi
          grep -n 'minifyEnabled\|shrinkResources\|isMinifyEnabled\|isShrinkResources' \
            build_tmp/android/app/build.gradle build_tmp/android/app/build.gradle.kts 2>/dev/null \
            || echo '（未找到 minify 配置行，将继续）'

      - name: flutter pub get
        working-directory: build_tmp
        run: flutter pub get

      - name: 插件子项目 compileSdk 统一 36（lifecycle AAR metadata 要求）
        run: |
          PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          # file_picker 等插件用硬编码数字（compileSdkVersion 34）而非 flutter 变量，
          # 因此同时匹配：数字 / flutter 变量 / 等号写法，全部统一到 36（minSdk 统一 24）
          grep -rl 'compileSdk' "$PUB_CACHE_DIR/hosted/pub.dev"/*/android/build.gradle* 2>/dev/null | while IFS= read -r f; do
            sed -i \
              -e 's/compileSdkVersion [0-9][0-9]\+/compileSdkVersion 36/' \
              -e 's/compileSdkVersion = [0-9][0-9]\+/compileSdkVersion = 36/' \
              -e 's/compileSdk [0-9][0-9]\+/compileSdk 36/' \
              -e 's/compileSdk = [0-9][0-9]\+/compileSdk = 36/' \
              -e 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/' \
              -e 's/compileSdk flutter\.compileSdkVersion/compileSdk 36/' \
              -e 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/' \
              -e 's/targetSdkVersion [0-9][0-9]\+/targetSdkVersion 36/' \
              -e 's/targetSdk = [0-9][0-9]\+/targetSdk 36/' \
              -e 's/minSdkVersion 2[0-9]/minSdkVersion 24/' \
              -e 's/minSdk = 2[0-9]\b/minSdk = 24/' \
              "$f" || true
          done
          # 诊断：直接把 file_picker 与 ML Kit commons 的 compileSdk 行注解带出
          grep -rn 'compileSdk' "$PUB_CACHE_DIR/hosted/pub.dev"/file_picker-*/android/build.gradle 2>/dev/null | head -3 | while IFS= read -r line; do
            echo "::error::FP ${line:0:180}"
          done
          grep -rn 'compileSdk' "$PUB_CACHE_DIR/hosted/pub.dev"/google_mlkit_commons-*/android/build.gradle 2>/dev/null | head -3 | while IFS= read -r line; do
            echo "::error::MK ${line:0:180}"
          done
          echo "done"

      - name: flutter analyze（输出存档，不阻塞）
        working-directory: build_tmp
        run: flutter analyze > ../analyze.log 2>&1 || true

      - name: Build release APK
        working-directory: build_tmp
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee ../build.log

      - name: Upload build logs（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            analyze.log
            build.log
          if-no-files-found: ignore

      - name: 失败时输出关键错误到 Step Summary 与 Annotations
        if: failure()
        run: |
          {
            echo "## Build 失败摘要（build.log 末尾 60 行）"
            echo '```'
            tail -n 60 build.log 2>/dev/null || echo '（build.log 不存在）'
            echo '```'
            echo "## analyze.log 末尾 40 行"
            echo '```'
            tail -n 40 analyze.log 2>/dev/null || echo '（analyze.log 不存在）'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 文件自检：确认日志存在与大小（匿名 API 可读）
          echo "::error::LS $(ls -la build.log analyze.log 2>/dev/null | awk '{print $5, $9}' | tr '\n' ' ')"
          # gradle 失败原因在 "What went wrong" 段落（日志中部）
          awk '/What went wrong/{f=1} f{print; n++} n>14{exit}' build.log 2>/dev/null | while IFS= read -r line; do
            echo "::error::W ${line:0:180}"
          done
          # 宽网提取：大小写不敏感的全部错误相关行（去重，限 50 条）
          grep -inE 'error|exception|failed|cannot|unable|missing|undefined|bad state|segfault|abort' build.log 2>/dev/null \
            | sort -u -t: -k2 | head -50 | while IFS= read -r line; do
              echo "::error::D ${line:0:200}"
            done
          # analyze.log 尾部全量（Dart 静态错误清单）
          tail -n 60 analyze.log 2>/dev/null | while IFS= read -r line; do
            echo "::error::A ${line:0:200}"
          done
          echo "done"

      - name: Rename APK with short commit
        run: |
          cp build_tmp/build/app/outputs/flutter-apk/app-release.apk \
             cuoti-app-${GITHUB_SHA::7}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuoti-app-release-apk
          path: cuoti-app-*.apk
          if-no-files-found: error
